version: "3.9"

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: safex-postgres
    environment:
      POSTGRES_USER: safex_user
      POSTGRES_PASSWORD: safex_pass
      POSTGRES_DB: safex_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: safex-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: safex-backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://safex_user:safex_pass@postgres:5432/safex_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis

  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: safex-ai-service
    ports:
      - "8000:8000"

volumes:
  postgres_data:
